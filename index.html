  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=0.3.21">

</head>
<body>
  <div class="version-badge" id="versionBadge" aria-label="Versão do aplicativo">v0.3.21 • Novo ícone de expandir</div>

  <div class="app-shell">
    <main class="content" id="content">
      <section class="view active event-view" data-view="event" aria-label="Adicionar evento">
        <div class="event-page">
          <header class="event-header">
            <h1>Evento</h1>
          </header>

          <div class="quick-action-row" aria-label="Ações rápidas">
            <div class="quick-actions">
            <button class="sleep-action sleep-start-action" id="sleepStartButton" type="button">
              <span class="sleep-action-icon" aria-hidden="true">☾</span>
              <span>Vou dormir</span>
            </button>
            <button class="sleep-action sleep-end-action" id="sleepEndButton" type="button" hidden>
              <span class="sleep-action-icon" aria-hidden="true">☀︎</span>
              <span>Acordei</span>
            </button>
            </div>

            <button class="primary-action event-create-button" id="createEventButton" type="button">
            <span class="action-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 20.7578 20.3672" width="24" height="24" aria-hidden="true">
              <g>
                <rect height="20.3672" opacity="0" width="20.7578" x="0" y="0"/>
                <path d="M10.1719 20.3516C15.7891 20.3516 20.3516 15.7969 20.3516 10.1797C20.3516 4.5625 15.7891 0 10.1719 0C4.55469 0 0 4.5625 0 10.1797C0 15.7969 4.55469 20.3516 10.1719 20.3516ZM10.1719 18.8984C5.35156 18.8984 1.45312 15 1.45312 10.1797C1.45312 5.35938 5.35156 1.46094 10.1719 1.46094C14.9922 1.46094 18.8906 5.35938 18.8906 10.1797C18.8906 15 14.9922 18.8984 10.1719 18.8984Z" fill="currentColor" fill-opacity="0.85"/>
                <path d="M10.8828 14.0469L10.8828 6.28906C10.8828 5.85156 10.5859 5.54688 10.1562 5.54688C9.74219 5.54688 9.44531 5.85156 9.44531 6.28906L9.44531 14.0469C9.44531 14.4766 9.74219 14.7812 10.1562 14.7812C10.5859 14.7812 10.8828 14.4844 10.8828 14.0469ZM6.28906 10.8828L14.0469 10.8828C14.4766 10.8828 14.7812 10.5938 14.7812 10.1797C14.7812 9.74219 14.4844 9.44531 14.0469 9.44531L6.28906 9.44531C5.85156 9.44531 5.55469 9.74219 5.55469 10.1797C5.55469 10.5938 5.85156 10.8828 6.28906 10.8828Z" fill="currentColor" fill-opacity="0.85"/>
              </g>
            </svg></span>
            <span>Criar evento</span>
            </button>
          </div>

          <section class="today-section" aria-labelledby="todayHeading">
            <div class="day-section-heading">
              <div>
                <p class="day-eyebrow">Hoje</p>
                <h2 id="todayHeading">Seu dia em 24 horas</h2>
              </div>
              <div class="timeline-zoom" role="group" aria-label="Zoom da linha do tempo de hoje">
                <button type="button" data-timeline-zoom="1" class="selected">1×</button>
                <button type="button" data-timeline-zoom="2">2×</button>
                <button type="button" data-timeline-zoom="4">4×</button>
              </div>
            </div>
            <div id="todayTimeline"></div>
          </section>

          <section class="yesterday-section" id="yesterdaySection" aria-labelledby="yesterdayHeading">
            <div class="day-section-heading compact">
              <div>
                <p class="day-eyebrow">Ontem</p>
                <h2 id="yesterdayHeading">Contexto recente</h2>
              </div>
            </div>
            <div id="yesterdayTimeline"></div>
          </section>
        </div>
      </section>
      <section class="view history-view" data-view="history" aria-label="Histórico">
        <div class="history-page">
          <header class="history-header">
            <div>
              <p class="day-eyebrow">Histórico</p>
              <h1>Todos os dias</h1>
            </div>
            <div class="history-day-label" id="historyCount"></div>
          </header>
          <div class="history-list" id="historyList"></div>
        </div>
      </section>
      <section class="view" data-view="analysis" aria-label="Análises"></section>
      <section class="view" data-view="learning" aria-label="Aprendizado"></section>

      <section class="view settings-view" data-view="settings" aria-label="Ajustes">
        <div class="settings-content">
          <section class="settings-section">
            <h2 class="section-label">Tema</h2>
            <div class="settings-card theme-mode-card">
              <div class="theme-mode-segment" role="group" aria-label="Tema">
                <button type="button" data-theme-choice="light"><span>Claro</span></button>
                <button type="button" data-theme-choice="system"><span>Sistema</span></button>
                <button type="button" data-theme-choice="dark"><span>Escuro</span></button>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="./version.js?v=20261006-05"></script>
  <script src="./navicons.js?v=20261006-05"></script>
  <script src="./app.js?v=20261006-05"></script>
  <script src="./enhancements.js?v=20261006-05"></script>
</body>
</html>
