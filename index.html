              </div>

                <button type="button" data-timeline-zoom="1" class="selected">1×</button>
                <button type="button" data-timeline-zoom="2">2×</button>
                <button type="button" data-timeline-zoom="4">4×</button>
              </div>

          <div class="goal-modal-wrap" id="goalModal" hidden>
            <div class="goal-modal-backdrop" data-close-goal-modal></div>
            <section class="goal-modal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
              <header class="goal-modal-header">
                <h2 id="goalModalTitle">Adicionar meta</h2>
                <button class="goal-modal-cancel" type="button" data-close-goal-modal>Cancelar</button>
              </header>
              <form class="goals-card-form" id="goalCardForm">
                <input id="goalCardInput" type="text" maxlength="160" placeholder="Qual é a sua meta?" autocomplete="off">
                <button type="submit">Salvar</button>
              </form>
            </section>
          </div>
          <div class="goal-modal-wrap" id="goalDetailsModal" hidden>
            <div class="goal-modal-backdrop" data-close-goal-details></div>
            <section class="goal-modal goal-details-modal" role="dialog" aria-modal="true" aria-labelledby="goalDetailsTitle">
              <header class="goal-modal-header">
                <h2 id="goalDetailsTitle">Meta</h2>
                <button class="goal-modal-cancel" type="button" data-close-goal-details>Fechar</button>
              </header>
              <div id="goalDetailView">
                <p class="goal-detail-text" id="goalDetailText"></p>
                <div class="goal-detail-actions">
                  <button class="goal-detail-edit" id="editGoalButton" type="button">Editar</button>
                  <button class="goal-detail-delete" id="deleteGoalButton" type="button">Apagar</button>
                </div>
              </div>
              <form class="goals-card-form goal-edit-form" id="goalEditForm" hidden>
                <input id="goalEditInput" type="text" maxlength="160" placeholder="Qual é a sua meta?" autocomplete="off">
                <div class="goal-edit-actions">
                  <button type="button" data-cancel-goal-edit>Cancelar</button>
                  <button type="submit">Salvar</button>
                </div>
              </form>
              <div class="goal-edit-warning" id="goalEditWarning" hidden>
                <strong>Salvar alterações?</strong>
                <span>Você está editando esta meta.</span>
                <div class="goal-edit-warning-actions">
                  <button type="button" data-discard-goal-edit>Descartar</button>
                  <button type="button" data-save-goal-edit>Salvar</button>
                </div>
              </div>
            </section>
          </div>
        </div>
        <div class="goals-page procrastinated-page" id="procrastinatedView" hidden>
          <header class="goals-subheader">
            <button class="goals-back-button" id="procrastinatedBackButton" type="button" aria-label="Voltar para Metas">‹</button>
            <h1>Procrastinadas</h1>
          </header>
          <form class="goals-add-form" id="procrastinatedForm">
            <input id="procrastinatedInput" type="text" maxlength="160" placeholder="O que você está adiando?" autocomplete="off">
            <button type="submit">Adicionar</button>
          </form>
          <ul class="goals-item-list" id="procrastinatedList"></ul>
        </div>
      </section>

    <div class="event-sheet-wrap" id="eventSheet" hidden>
      <div class="event-sheet-backdrop" data-close-event-sheet></div>
      <section class="event-sheet" role="dialog" aria-modal="true" aria-labelledby="eventSheetTitle">
        <div class="event-sheet-head">
          <button class="sheet-text-button" type="button" data-close-event-sheet>Cancelar</button>
          <h2 id="eventSheetTitle">Novo evento</h2>
          <button class="sheet-text-button save" id="saveEventButton" type="button">Salvar</button>
        </div>

        <div class="event-form">
          <label>
            <span>Tipo</span>
            <select id="eventTypeInput">
              <option value="event">Geral</option>
              <option value="sleep_start">Dormi</option>
              <option value="sleep_end">Acordei</option>
            </select>
          </label>

          <label>
            <span>Evento</span>
            <input id="eventTitleInput" type="text" maxlength="120" placeholder="O que aconteceu?" autocomplete="off">
          </label>

          <label>
            <span>Data e hora</span>
            <input id="eventDateTimeInput" type="datetime-local">
          </label>

          <label>
            <span>Nota <small>opcional</small></span>
            <textarea id="eventNotesInput" rows="3" maxlength="1000" placeholder="Algum detalhe?"></textarea>
          </label>
        </div>
      </section>
    </div>

    <div class="event-sheet-wrap" id="eventDetailsSheet" hidden>
      <div class="event-sheet-backdrop" data-close-event-details></div>
      <section class="event-sheet event-details-sheet" role="dialog" aria-modal="true" aria-labelledby="eventDetailsTitle">
        <div class="event-sheet-head details-head">
          <button class="sheet-text-button" type="button" data-close-event-details>Fechar</button>
          <h2>Detalhes</h2>
          <span></span>
        </div>
        <div class="event-details">
          <time id="eventDetailsTime"></time>
          <div class="event-details-kind" id="eventDetailsKind" hidden>
            <span class="event-details-kind-icon" id="eventDetailsKindIcon" aria-hidden="true"></span>
            <span id="eventDetailsKindLabel"></span>
          </div>
          <h3 id="eventDetailsTitle"></h3>
          <p id="eventDetailsNotes"></p>
          <div class="event-detail-actions" id="eventDetailActions" hidden>
            <button class="event-detail-edit" id="editEventButton" type="button">Editar</button>
            <button class="event-detail-delete" id="deleteEventButton" type="button">Excluir</button>
          </div>
        </div>
      </section>
    </div>
