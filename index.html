<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crono">
<meta name="description" content="Registre e planeje seu dia em uma linha do tempo simples.">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" href="./icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="./styles.css?v=3.5.0">
<title>Crono</title>
<script src="./app.js?v=3.5.0" defer></script>
</head>
<body>
<main id="crono" class="app" aria-label="Crono">
  <header class="header">
    <div class="brand-area">
      <h1 class="brand">Crono<span>.</span></h1>
      <div class="date" id="date">Hoje</div>
    </div>
    <button class="clock" id="nowbtn" aria-label="Voltar ao horário atual">
      <small>● AGORA</small>
      <strong id="clock">--:--</strong>
    </button>
    <div class="right">
      <button class="help-button" id="help" aria-label="Como usar">?</button>
      <button class="add" id="add">+ Evento</button>
    </div>
  </header>
  <section class="timeline-wrap" aria-label="Linha do tempo do dia">
    <div class="view" id="view">
      <div class="canvas" id="canvas">
        <div class="axis" aria-hidden="true"></div>
        <div id="hours" aria-hidden="true"></div>
        <div id="events"></div>
        <div class="now-line" id="nowline" aria-hidden="true"><span id="nowlabel"></span></div>
      </div>
    </div>
    <div class="edge-glow top" id="glow-top" aria-hidden="true"></div>
    <div class="edge-glow bottom" id="glow-bottom" aria-hidden="true"></div>
    <div class="zoom" role="group" aria-label="Zoom temporal">
      <button id="minus" aria-label="Diminuir zoom">−</button>
      <div class="separator"></div>
      <span id="zoomval" aria-live="polite">12h</span>
      <div class="separator"></div>
      <button id="plus" aria-label="Aumentar zoom">+</button>
    </div>
  </section>
  <footer class="legend" aria-label="Legenda de cores">
    <span><i class="past-dot"></i>Passado</span>
    <span><i class="live-dot"></i>Em andamento</span>
    <span><i class="future-dot"></i>Planejado</span>
  </footer>
  <div id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>
</body>
</html>
