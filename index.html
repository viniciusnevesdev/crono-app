  <script>
    (() => {
      const localVersion = '0.3.0';
      fetch('./latest.json?t=' + Date.now(), { cache: 'no-store' })
        .then(response => response.ok ? response.json() : null)
        .then(latest => {
          if (!latest?.version || latest.version === localVersion) return;
          const url = new URL(location.href);
          url.searchParams.set('v', latest.version);
          url.searchParams.set('refresh', Date.now());
          location.replace(url.toString());
        })
        .catch(() => {});
    })();

  <div class="app-shell">
    <main class="content" id="content">
      <section class="view active event-view" data-view="event" aria-label="Adicionar evento">
        <div class="event-page">

            <h1>Evento</h1>

          <button class="primary-action event-create-button" id="createEventButton" type="button">

              </g>
            </svg></span>
            <span>Criar evento</span>
          </button>

          <div class="event-summary" id="eventSummary" aria-live="polite"></div>

          <section class="today-section" aria-labelledby="todayHeading">
            <div class="day-section-heading">
              <div>
                <p class="day-eyebrow">Hoje</p>
                <h2 id="todayHeading">Seu dia em 24 horas</h2>
              </div>
              <div class="timeline-zoom" role="group" aria-label="Zoom da linha do tempo de hoje">
                <button type="button" data-timeline-zoom="1" class="selected">1×</button>
                <button type="button" data-timeline-zoom="2">2×</button>
                <button type="button" data-timeline-zoom="4">4×</button>
              </div>
            </div>
            <div id="todayTimeline"></div>
          </section>

          <section class="yesterday-section" id="yesterdaySection" aria-labelledby="yesterdayHeading">
            <div class="day-section-heading compact">
              <div>
                <p class="day-eyebrow">Ontem</p>
                <h2 id="yesterdayHeading">Contexto recente</h2>
              </div>
            </div>
            <div id="yesterdayTimeline"></div>
          </section>
        </div>
      </section>
      <section class="view history-view" data-view="history" aria-label="Histórico">
        <div class="history-page">
          <header class="history-header">
            <div>
              <p class="day-eyebrow">Histórico</p>
              <h1>Todos os dias</h1>
            </div>
            <div class="history-day-label" id="historyCount"></div>
          </header>
          <div class="history-list" id="historyList"></div>
        </div>
      </section>
      <section class="view" data-view="analysis" aria-label="Análises"></section>
      <section class="view" data-view="learning" aria-label="Aprendizado"></section>

      <section class="view settings-view" data-view="settings" aria-label="Ajustes">
        <div class="settings-content">
          <section class="settings-section">
            <h2 class="section-label">Tema</h2>
            <div class="settings-card theme-mode-card">
              <div class="theme-mode-segment" role="group" aria-label="Tema">
                <button type="button" data-theme-choice="light">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.7"/></svg>
                  <span>Claro</span>
                </button>
                <button type="button" data-theme-choice="system">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="6.7"/>
                    <path d="M16.8 7.2 7.2 16.8"/>
                    <path class="theme-system-fill" d="M16.8 7.2A6.8 6.8 0 0 1 7.2 16.8Z" fill="currentColor" stroke="none"/>
                  </svg>
                  <span>Sistema</span>
                </button>
                <button type="button" data-theme-choice="dark">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"><circle class="theme-dark-fill" cx="12" cy="12" r="6.7" fill="currentColor" stroke="none"/></svg>
                  <span>Escuro</span>
                </button>
              </div>
            </div>
          </section>

                  <strong>Ultra</strong>
                </button>
              </div>
            </div>
          </section>

            <h2 class="section-label">Backup</h2>

        </div>
      </section>
    </main>

    <div class="event-sheet-wrap" id="eventSheet" hidden>
      <div class="event-sheet-backdrop" data-close-event-sheet></div>
      <section class="event-sheet" role="dialog" aria-modal="true" aria-labelledby="eventSheetTitle">
        <div class="event-sheet-head">
          <button class="sheet-text-button" type="button" data-close-event-sheet>Cancelar</button>
          <h2 id="eventSheetTitle">Novo evento</h2>
          <button class="sheet-text-button save" id="saveEventButton" type="button">Salvar</button>
        </div>

        <div class="event-form">
          <label>
            <span>Evento</span>
            <input id="eventTitleInput" type="text" maxlength="120" placeholder="O que aconteceu?" autocomplete="off">
          </label>

          <label>
            <span>Data e hora</span>
            <input id="eventDateTimeInput" type="datetime-local">
          </label>

          <label>
            <span>Nota <small>opcional</small></span>
            <textarea id="eventNotesInput" rows="3" maxlength="1000" placeholder="Algum detalhe?"></textarea>
          </label>
        </div>
      </section>
    </div>

    <div class="app-toast" id="appToast" role="status" aria-live="polite"></div>

        <span data-icon="chart"></span><small>Análises</small>
      </button>

      <button class="tab-item" type="button" data-tab="learning">
        <span data-icon="spark"></span><small>Aprendizado</small>
      </button>

      <button class="tab-item" type="button" data-tab="settings">
        <span data-icon="settings"></span><small>Ajustes</small>
      </button>

  </div>
