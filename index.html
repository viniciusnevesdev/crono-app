<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Crono">
  <title>Crono</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="content" id="content" aria-live="polite"></main>

    <nav class="tab-bar capsule-tabbar" aria-label="Navegação principal">
      <span class="tab-bubble" aria-hidden="true"></span>

      <button class="tab-item selected" type="button" data-tab="home" aria-label="Início">
        <span class="tab-icon" data-icon="home"></span>
        <small>Início</small>
      </button>

      <button class="tab-item" type="button" data-tab="history" aria-label="Histórico">
        <span class="tab-icon" data-icon="history"></span>
        <small>Histórico</small>
      </button>

      <button class="tab-item" type="button" data-tab="analysis" aria-label="Análises">
        <span class="tab-icon" data-icon="chart"></span>
        <small>Análises</small>
      </button>

      <button class="tab-item" type="button" data-tab="settings" aria-label="Ajustes">
        <span class="tab-icon" data-icon="settings"></span>
        <small>Ajustes</small>
      </button>
    </nav>
  </div>

  <script src="./app.js"></script>
</body>
</html>
